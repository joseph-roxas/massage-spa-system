name: Deploy DB

on:
  push:
    branches: [main]
    paths: ['DB/migrations/**']
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-db
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Inject D1 database id
        run: |
          test -n "${{ vars.D1_DATABASE_ID }}" || { echo "Set the D1_DATABASE_ID repository variable"; exit 1; }
          sed -i 's/D1_DATABASE_ID_PLACEHOLDER/${{ vars.D1_DATABASE_ID }}/' DB/wrangler.toml
      - name: Apply migrations to production D1
        run: npm run migrate:remote -w DB
