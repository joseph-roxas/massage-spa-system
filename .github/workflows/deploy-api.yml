name: Deploy API

on:
  push:
    branches: [main]
    paths: ['API/**', 'packages/**', 'DB/schema/**']
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w API -w packages/domain -w DB
      - run: npm test -w API -w packages/domain
      - name: Inject D1 database id
        run: |
          test -n "${{ vars.D1_DATABASE_ID }}" || { echo "Set the D1_DATABASE_ID repository variable"; exit 1; }
          sed -i 's/D1_DATABASE_ID_PLACEHOLDER/${{ vars.D1_DATABASE_ID }}/' API/wrangler.toml
      - name: Deploy Worker
        run: npm run deploy -w API
