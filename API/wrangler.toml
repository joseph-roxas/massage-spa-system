name = "massage-spa-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# 01:00 Manila daily: recurring Expense drafts and the monthly Royalty draft (both idempotent).
# 06:00 Manila daily: Auto Clock-out for anyone still clocked in from the day before.
[triggers]
crons = ["0 17 * * *", "0 22 * * *"]

# The database_id placeholder is replaced in CI from the D1_DATABASE_ID
# repository variable; locally any value works.
[[d1_databases]]
binding = "DB"
database_name = "massage-spa-db"
database_id = "D1_DATABASE_ID_PLACEHOLDER"
migrations_dir = "../DB/migrations"

[vars]
SUPER_ADMIN_EMAIL = "desiree.ababon@gmail.com"
APP_URL = "https://massage-spa-ui.pages.dev"

# Uncomment once a domain with Email Routing is on Cloudflare (ADR 0002), and
# set EMAIL_FROM above to an address on that domain, e.g. "noreply@yourspa.ph".
# [[send_email]]
# name = "EMAIL"
# destination_address = "desiree.ababon@gmail.com"
