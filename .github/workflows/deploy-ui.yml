name: Deploy UI

on:
  push:
    branches: [main]
    paths: ['UI/**', 'packages/**']
  workflow_dispatch:
  workflow_call:

concurrency:
  group: deploy-ui
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w UI
      - name: Ensure Pages project exists
        working-directory: UI
        run: npx wrangler pages project create massage-spa-ui --production-branch main || true
      - name: Deploy Pages
        working-directory: UI
        run: npx wrangler pages deploy ./dist --project-name massage-spa-ui --branch main
